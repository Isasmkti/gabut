<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kucing Pengumpul Koin</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#f4f1ea;--fg:#2b2622;--muted:#6b645c;--btn:#2b2622;--btnfg:#fffdf8;--accent:#e8883a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a17;--fg:#f0ebe3;--muted:#a39b90;--btn:#f0ebe3;--btnfg:#1c1a17}}
:root[data-theme="dark"]{--bg:#1c1a17;--fg:#f0ebe3;--muted:#a39b90;--btn:#f0ebe3;--btnfg:#1c1a17}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 12px;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overflow:hidden}
.wrap{width:100%;max-width:min(900px,calc(58vh * 16 / 9))}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
.hud button{border:0;border-radius:8px;padding:6px 12px;background:var(--btn);color:var(--btnfg);font-size:.85rem}
canvas{width:100%;display:block;border-radius:12px;image-rendering:pixelated;background:#8fd0f0}
.pad{width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;margin-bottom:6px}
.pad .grp{display:flex;gap:12px}
.pad button{width:clamp(64px,18vw,96px);height:clamp(64px,18vw,96px);border:0;border-radius:18px;background:var(--btn);color:var(--btnfg);font-size:1.8rem;touch-action:none;-webkit-tap-highlight-color:transparent}
.pad button.on{transform:scale(.93);opacity:.75}
.hint{font-size:.8rem;color:var(--muted);text-align:center;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>🪙 <span id="coins">0</span> / <span id="total">0</span></span><button id="reset">Ulangi</button></div>
  <canvas id="game" width="400" height="225"></canvas>
  <p class="hint">Panah kiri/kanan = jalan, panah atas atau spasi = lompat</p>
</div>
<div class="pad">
  <div class="grp"><button id="bL">◀</button><button id="bR">▶</button></div>
  <button id="bU">⤒</button>
</div>

<script>
/* ===== FRAME KUCING =====
   Isi FRAME_FILES dengan path PNG kamu, contoh:
   { idle:["cat/idle_1.png",...], walk:["cat/walk_1.png",...], jump:["cat/jump_1.png",...] }
   (jump harus 4 frame: jongkok, naik, puncak, turun). null = pakai placeholder kode. */
const FRAME_FILES = null;

const O="#e8883a", D="#b45f1f", K="#2b1a12", WH="#fff6e8";
function drawCat(c,p){
  const r=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};
  const by=p.bob||0, t=p.tail||0;
  r(5,13+by+t,2,2,D);r(6,15+by,3,2,D);r(7,17+by,3,3,D);
  (p.legs||[[0,0],[0,0],[0,0],[0,0]]).forEach((l,i)=>{
    const x=[9,12,19,22][i]+l[0];
    r(x,22+by-l[1],3,5+l[1],i%2?D:O);r(x,26+by,3,1,K);
  });
  r(8,15+by,16,8,O);r(8,15+by,16,1,K);r(8,22+by,16,1,D);
  r(10,17+by,3,2,D);r(15,17+by,3,2,D);
  r(21,9+by,9,9,O);r(21,9+by,9,1,K);
  r(21,8+by,2,2,K);r(28,8+by,2,2,K);r(22,9+by,1,1,D);r(28,9+by,1,1,D);
  if(p.blink) r(26,12+by,3,1,K); else {r(26,11+by,2,3,K);r(27,11+by,1,1,WH)}
  r(29,14+by,1,1,"#e86a8a");r(24,15+by,5,1,WH);
}
function makeFrames(){
  const S={idle:[],walk:[],jump:[]};
  const mk=(n,p)=>{const cv=document.createElement("canvas");cv.width=cv.height=32;drawCat(cv.getContext("2d"),p);S[n].push(cv.toDataURL())};
  [[0,0,0],[0,-1,0],[1,-2,0],[1,-1,1]].forEach(a=>mk("idle",{bob:a[0],tail:a[1],blink:a[2]}));
  for(let k=0;k<6;k++){
    const ph=k/6*Math.PI*2, a=i=>ph+(i%2?Math.PI:0)+(i>1?Math.PI:0);
    mk("walk",{bob:k%3===0?1:0,tail:k%2?-1:0,legs:[0,1,2,3].map(i=>[Math.round(Math.sin(a(i))*2),Math.cos(a(i))>0?1:0])});
  }
  mk("jump",{bob:2,legs:[[-1,0],[-1,0],[1,0],[1,0]]});
  mk("jump",{bob:-3,tail:2,legs:[[-2,1],[-2,1],[2,1],[2,1]]});
  mk("jump",{bob:-5,legs:[[0,0],[0,0],[0,0],[0,0]]});
  mk("jump",{bob:-2,tail:-2,legs:[[-2,0],[-2,0],[2,0],[2,0]]});
  return S;
}
const files = FRAME_FILES || makeFrames();
const anim = {};
for (const n in files) anim[n] = files[n].map(s => { const i = new Image(); i.src = s; return i; });
const FPS = { idle:5, walk:10 };

/* ===== LEVEL ===== */
const W=400, H=225, WORLD=1800, GROUND=185;
const solids = [
  {x:0,y:GROUND,w:WORLD,h:40,ground:true},
  {x:300,y:140,w:96,h:16},  {x:440,y:110,w:96,h:16},  {x:580,y:80,w:96,h:16},
  {x:770,y:145,w:48,h:40},  {x:860,y:130,w:96,h:16},  {x:1010,y:100,w:128,h:16},
  {x:1190,y:135,w:96,h:16}, {x:1330,y:105,w:96,h:16}, {x:1470,y:75,w:96,h:16},
  {x:1630,y:130,w:128,h:16}
];
const coinPos = [
  [120,168],[170,168],[220,168],
  [348,124],[488,94],[628,64],
  [794,128],[908,114],[1074,84],[1060,84],[1088,84],
  [1238,119],[1378,89],[1518,59],
  [1560,168],[1694,114],[1670,114],[1718,114]
];

/* ===== INPUT ===== */
const keys = { left:false, right:false, up:false };
const kmap = { ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", " ":"up" };
addEventListener("keydown", e => { if(kmap[e.key]){ keys[kmap[e.key]]=true; e.preventDefault(); } });
addEventListener("keyup",   e => { if(kmap[e.key]) keys[kmap[e.key]]=false; });
[["bL","left"],["bR","right"],["bU","up"]].forEach(([id,k])=>{
  const b=document.getElementById(id);
  b.addEventListener("pointerdown",e=>{keys[k]=true;b.classList.add("on");b.setPointerCapture(e.pointerId);e.preventDefault()});
  ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>b.addEventListener(ev,()=>{keys[k]=false;b.classList.remove("on")}));
});
addEventListener("contextmenu", e => e.preventDefault());

/* ===== STATE ===== */
const cv=document.getElementById("game"), ctx=cv.getContext("2d");
ctx.imageSmoothingEnabled=false;
const SIZE=64, HB={w:44,h:38,ox:10,oy:16};
const coinsEl=document.getElementById("coins"), totalEl=document.getElementById("total");
let cat, coins, score, camX, won, time;
function reset(){
  cat={x:40,y:GROUND-HB.h,vx:0,vy:0,facing:1,state:"idle",frame:0,timer:0,ground:true};
  coins=coinPos.map(([x,y])=>({x,y,got:false}));
  score=0; camX=0; won=false; time=0;
  coinsEl.textContent=0; totalEl.textContent=coins.length;
}
document.getElementById("reset").addEventListener("click",reset);
reset();

const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function setState(s){ if(cat.state!==s){ cat.state=s; cat.frame=0; cat.timer=0; } }

/* ===== UPDATE ===== */
function update(dt){
  time+=dt;
  const dir=(keys.right?1:0)-(keys.left?1:0);
  if(dir) cat.facing=dir;
  cat.vx=dir*120;
  if(keys.up && cat.ground){ cat.vy=-390; cat.ground=false; }
  cat.vy=Math.min(cat.vy+950*dt,600);

  const box=()=>({x:cat.x,y:cat.y,w:HB.w,h:HB.h});
  cat.x+=cat.vx*dt;
  cat.x=Math.max(0,Math.min(WORLD-HB.w,cat.x));
  for(const s of solids) if(overlap(box(),s)){ cat.x = cat.vx>0 ? s.x-HB.w : s.x+s.w; }
  cat.y+=cat.vy*dt;
  cat.ground=false;
  for(const s of solids) if(overlap(box(),s)){
    if(cat.vy>0){ cat.y=s.y-HB.h; cat.ground=true; } else if(cat.vy<0){ cat.y=s.y+s.h; }
    cat.vy=0;
  }

  // koin
  for(const c of coins) if(!c.got && overlap(box(),{x:c.x-6,y:c.y-6,w:12,h:12})){
    c.got=true; score++; coinsEl.textContent=score;
    if(score===coins.length) won=true;
  }

  // animasi
  setState(!cat.ground?"jump":dir?"walk":"idle");
  if(cat.state==="jump"){ cat.frame = cat.vy<-100?1 : cat.vy<100?2 : 3; }
  else{
    cat.timer+=dt;
    if(cat.timer>1/FPS[cat.state]){ cat.timer=0; cat.frame=(cat.frame+1)%anim[cat.state].length; }
  }

  // kamera
  const target=cat.x+HB.w/2-W/2;
  camX+=(Math.max(0,Math.min(WORLD-W,target))-camX)*Math.min(1,dt*8);
}

/* ===== DRAW ===== */
function drawBackground(cx){
  const g=ctx.createLinearGradient(0,0,0,GROUND);
  g.addColorStop(0,"#6fb8e8");g.addColorStop(1,"#bfe6f5");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,255,255,.85)";
  for(let i=0;i<8;i++){
    const x=((i*260-cx*0.3)%(W+200)+W+200)%(W+200)-100, y=20+(i*37)%60;
    ctx.fillRect(x,y,60,12);ctx.fillRect(x+10,y-8,36,10);
  }
  ctx.fillStyle="#7fae6a";
  for(let i=0;i<10;i++){
    const x=((i*150-cx*0.5)%(W+150)+W+150)%(W+150)-75;
    ctx.fillRect(x,GROUND-30-(i*13)%20,90,60);
  }
}
function drawSolid(s,cx){
  const x=Math.round(s.x-cx);
  if(x>W||x+s.w<0) return;
  if(s.ground){
    ctx.fillStyle="#8a5a36";ctx.fillRect(x,s.y,s.w,s.h);
    ctx.fillStyle="#6e4527";
    for(let i=0;i<s.w;i+=24) ctx.fillRect(x+i,s.y+14+(i%48?8:0),10,4);
    ctx.fillStyle="#5fa04e";ctx.fillRect(x,s.y,s.w,7);
    ctx.fillStyle="#3f7a35";ctx.fillRect(x,s.y+7,s.w,2);
  }else{
    ctx.fillStyle="#c9773c";ctx.fillRect(x,s.y,s.w,s.h);
    ctx.fillStyle="#8f4d22";
    for(let ty=0;ty<s.h;ty+=16){
      ctx.fillRect(x,s.y+ty+15,s.w,1);
      for(let tx=(ty/16%2)*8;tx<s.w;tx+=16) ctx.fillRect(x+tx,s.y+ty,1,16);
    }
    ctx.fillStyle="#5fa04e";ctx.fillRect(x,s.y,s.w,4);
    ctx.fillStyle="#e3a064";ctx.fillRect(x,s.y+4,s.w,1);
  }
}
function drawCoin(c,cx){
  const x=Math.round(c.x-cx); if(x<-10||x>W+10) return;
  const w=Math.max(1,Math.abs(Math.cos(time*4+c.x*0.05))*6);
  const y=c.y+Math.sin(time*3+c.x)*2;
  ctx.fillStyle="#b8860b";ctx.fillRect(x-w-1,y-7,w*2+2,14);
  ctx.fillStyle="#ffd23f";ctx.fillRect(x-w,y-6,w*2,12);
  ctx.fillStyle="#fff2a8";ctx.fillRect(x-w+1,y-5,Math.max(1,w/2),4);
}
function draw(){
  const cx=Math.round(camX);
  drawBackground(cx);
  solids.forEach(s=>drawSolid(s,cx));
  coins.forEach(c=>{ if(!c.got) drawCoin(c,cx); });

  const frames=anim[cat.state], img=frames[cat.frame];
  const px=Math.round(cat.x-HB.ox-cx), py=Math.round(cat.y-HB.oy);
  ctx.save();
  if(cat.facing<0){ ctx.translate(px+SIZE,py); ctx.scale(-1,1); ctx.drawImage(img,0,0,SIZE,SIZE); }
  else ctx.drawImage(img,px,py,SIZE,SIZE);
  ctx.restore();

  if(won){
    ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#ffd23f";ctx.textAlign="center";
    ctx.font="bold 22px system-ui,sans-serif";ctx.fillText("Semua koin terkumpul!",W/2,H/2-6);
    ctx.fillStyle="#fff";ctx.font="14px system-ui,sans-serif";
    ctx.fillText("Tekan Ulangi untuk main lagi",W/2,H/2+18);
  }
}

/* ===== LOOP ===== */
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,0.033); last=now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
